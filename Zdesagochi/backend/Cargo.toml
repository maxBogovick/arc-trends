[package]
name = "zdesagochi-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zdesagochi-backend"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "trace", "request-id", "limit", "timeout"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid"] }

# Redis
deadpool-redis = "0.14"
redis = { version = "0.25", features = ["tokio-comp"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"

# IDs
ulid = { version = "1", features = ["serde"] }

# Random + hashing for refresh tokens
rand = "0.8"
hex = "0.4"
sha2 = "0.10"

# Error handling
thiserror = "1"
anyhow = "1"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
dotenvy = "0.15"

# Time
chrono = { version = "0.4", features = ["serde"] }

# OpenAPI
utoipa = { version = "4", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }

# Streaming / SSE
futures = "0.3"
tokio-stream = "0.1"

# HTTP utils
uuid = { version = "1", features = ["v4"] }

# Observability — OpenTelemetry
tracing-opentelemetry = "0.27"
opentelemetry = "0.26"
opentelemetry-otlp = { version = "0.26", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
tonic = "0.12"

# Observability — Prometheus metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
