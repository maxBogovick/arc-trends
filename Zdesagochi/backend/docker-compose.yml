version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zdesagochi
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: zdesagochi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zdesagochi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://zdesagochi:secret@postgres:5432/zdesagochi
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-to-a-256-bit-secret-in-production
      JWT_EXPIRY_SECONDS: "3600"
      REFRESH_TOKEN_EXPIRY_SECONDS: "2592000"
      HOST: "0.0.0.0"
      PORT: "8080"
      ENVIRONMENT: development
      CORS_ORIGINS: "http://localhost:5173"
      LOG_LEVEL: info
      RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
